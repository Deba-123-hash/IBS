name: Frontend Deployment Verification

on:
  push:
    paths:
      - 'client/**'
    branches: [ main ]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Vite App
        run: |
          cd client
          npm ci || npm install
          npm run build
