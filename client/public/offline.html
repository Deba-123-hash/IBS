<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | CAMPUS OS</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8faf9; color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: white; max-width: 420px; width: 100%; padding: 32px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.05); text-align: center; border: 1px solid #e2e8f0; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px 0; color: #0f172a; font-weight: 800; }
    p { font-size: 14px; color: #64748b; line-height: 1.5; margin: 0 0 24px 0; }
    button { background: #059669; color: white; border: none; padding: 12px 24px; font-size: 14px; font-weight: 700; border-radius: 12px; cursor: pointer; width: 100%; }
    button:hover { background: #047857; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>CAMPUS OS Offline Mode</h1>
    <p>You are currently offline. CAMPUS OS cached passes, schedules, and active credentials remain accessible locally.</p>
    <button onclick="window.location.reload()">Reconnect to CAMPUS OS</button>
  </div>
</body>
</html>
