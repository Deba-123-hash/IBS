<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Campus Life, Debugged</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: white; max-width: 420px; width: 100%; padding: 32px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); text-align: center; border: 1px solid #e2e8f0; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px 0; color: #1e293b; }
    p { font-size: 14px; color: #64748b; line-height: 1.5; margin: 0 0 24px 0; }
    button { background: #2563eb; color: white; border: none; padding: 10px 20px; font-size: 14px; font-weight: 500; border-radius: 8px; cursor: pointer; width: 100%; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You are currently offline</h1>
    <p>Campus Life, Debugged is in low-bandwidth offline mode. Your active gate passes and cached schedule are still available locally.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
